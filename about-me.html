<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us - BrandName</title>

  <!-- 1. THIS LINE LINKS TO YOUR CSS FILE -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 2. THIS ENTIRE HEADER SECTION CREATES THE TOP NAV BAR -->
  <header>
    <div class="container navbar">
      <!-- Clicking logo returns to Home -->
      <a href="index.html" class="logo">BrandName</a>
      
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu">&#9776;</button>
      
      <!-- Navigation Links -->
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </div>
  </header>

  <!-- Main Content of About Page -->
  <main>
    <section class="hero">
      <div class="container">
        <h1>About Our Company</h1>
        <p>Learn more about our mission, team, and history.</p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; <span id="year"></span> BrandName. All rights reserved.</p>
    </div>
  </footer>

  <!-- JavaScript for Mobile Menu & Dynamic Year -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const menuToggle = document.getElementById('menu-toggle');
    const navLinks = document.getElementById('nav-links');
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
  </script>
</body>
</html>
