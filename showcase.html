  <section class="mnist-demo" aria-label="MNIST digit recognizer demo">
  <div class="mnist-demo-inner">
    <h2 class="mnist-demo-title">Draw a digit</h2>
    <p class="mnist-demo-subtitle">
      A small neural network (trained from scratch on MNIST) will guess what you drew.
    </p>

    <div class="mnist-demo-layout">
      <div class="mnist-canvas-wrap">
        <canvas id="mnist-canvas" width="280" height="280" aria-label="Drawing canvas"></canvas>
        <div class="mnist-controls">
          <button id="mnist-clear" type="button" class="mnist-btn mnist-btn-secondary">Clear</button>
          <button id="mnist-predict" type="button" class="mnist-btn mnist-btn-primary">Predict</button>
        </div>
      </div>

      <div id="mnist-result" class="mnist-result" aria-live="polite">Loading model…</div>
    </div>
  </div>
</section>

<style>
  .mnist-demo {
    --mnist-bg: #111318;
    --mnist-panel: #1b1e26;
    --mnist-border: #2c3038;
    --mnist-accent: #5ec8f8;
    --mnist-text: #e8eaf0;
    --mnist-muted: #9aa1af;

    max-width: 720px;
    margin: 2.5rem auto;
    padding: 2rem;
    background: var(--mnist-bg);
    border: 1px solid var(--mnist-border);
    border-radius: 16px;
    color: var(--mnist-text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .mnist-demo-title {
    margin: 0 0 0.25rem;
    font-size: 1.5rem;
    font-weight: 700;
  }

  .mnist-demo-subtitle {
    margin: 0 0 1.5rem;
    color: var(--mnist-muted);
    font-size: 0.95rem;
  }

  .mnist-demo-layout {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    align-items: flex-start;
  }

  .mnist-canvas-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }

  #mnist-canvas {
    width: 280px;
    height: 280px;
    border-radius: 10px;
    border: 1px solid var(--mnist-border);
    touch-action: none;
    cursor: crosshair;
    background: #000;
  }

  .mnist-controls {
    display: flex;
    gap: 0.6rem;
  }

  .mnist-btn {
    padding: 0.55rem 1.1rem;
    border-radius: 8px;
    border: 1px solid var(--mnist-border);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.05s ease, opacity 0.15s ease;
  }

  .mnist-btn:active {
    transform: scale(0.97);
  }

  .mnist-btn-secondary {
    background: var(--mnist-panel);
    color: var(--mnist-text);
  }

  .mnist-btn-secondary:hover {
    opacity: 0.85;
  }

  .mnist-btn-primary {
    background: var(--mnist-accent);
    color: #06202c;
    border-color: transparent;
  }

  .mnist-btn-primary:hover {
    opacity: 0.9;
  }

  .mnist-btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .mnist-result {
    flex: 1;
    min-width: 220px;
    background: var(--mnist-panel);
    border: 1px solid var(--mnist-border);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    font-size: 0.9rem;
    color: var(--mnist-muted);
  }

  .mnist-top-prediction {
    font-size: 1.05rem;
    color: var(--mnist-text);
    margin-bottom: 0.9rem;
  }

  .mnist-top-prediction strong {
    color: var(--mnist-accent);
    font-size: 1.3rem;
  }

  .mnist-bar-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.35rem;
  }

  .mnist-bar-label {
    width: 1rem;
    color: var(--mnist-muted);
    font-variant-numeric: tabular-nums;
  }

  .mnist-bar-track {
    flex: 1;
    height: 8px;
    background: #0e1015;
    border-radius: 4px;
    overflow: hidden;
  }

  .mnist-bar-fill {
    height: 100%;
    background: var(--mnist-accent);
  }

  .mnist-bar-pct {
    width: 3rem;
    text-align: right;
    color: var(--mnist-muted);
    font-variant-numeric: tabular-nums;
    font-size: 0.8rem;
  }

  @media (max-width: 560px) {
    .mnist-demo-layout {
      flex-direction: column;
      align-items: center;
    }
  }
</style>
